name: LineageOS 22.2 star2lte

# Full-ROM build for star2lte (Galaxy S9+ Exynos 9810) on GitHub Actions.
#
# HEAVY: a from-scratch LineageOS 22 build needs a lot of disk and time.
#
# DISK — run #1 lesson (Skyshadow2020 run #1): the ubuntu-24.04 free runner is
# a SINGLE 145G disk (no separate /mnt anymore) and a shallow LOS 22.2 sync
# alone fills ~100G. Two levers keep it alive:
#   1. `--partial-clone --clone-filter=blob:limit=500K` (the official LOS
#      recommendation for constrained disks) — blobs download on demand.
#   2. the local manifest remove-projects the emulator-only repos
#      (cuttlefish/emulator/qemu/goldfish — never referenced by a real build).
# A cold full build can still exceed the 6h free-runner limit; ccache is
# persisted between runs, so a re-run reuses everything that compiled.
#
# GitHub Actions ONLY for this project — no self-hosted/VPS runners.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sync = fetch source only · build = sync + compile"
        default: "build"
        type: choice
        options: ["build", "sync"]
      variant:
        description: "build variant"
        default: "userdebug"
        type: choice
        options: ["userdebug", "user", "eng"]

concurrency:
  group: los22-star2lte
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # Runs #1-#5 lesson chain: this runner image has a SINGLE 145G disk (no
      # separate /mnt), which breaks easimon/maximize-build-space's LVM math:
      # the tmp PV gets fallocated out of the same root fs (root at 100%),
      # and with a small tmpfs the action dies outright (fallocate: invalid
      # length). LVM buys nothing on a single-disk runner — do the reclaim
      # by hand and build directly on the root fs.
      - name: Reclaim root disk (manual, no LVM)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          sudo fallocate -l 4G /build-swap && sudo chmod 600 /build-swap \
            && sudo mkswap /build-swap && sudo swapon /build-swap
          # easimon used to create+mount the build dir; without it the
          # working-directory of the later steps does not exist (run #6)
          mkdir -p /home/runner/work/los
          df -h /

      - name: Checkout (local manifest lives here)
        uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 python-is-python3 openjdk-21-jdk-headless
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/work/los/.ccache
          key: ccache-los22-star2lte-${{ github.run_id }}
          restore-keys: ccache-los22-star2lte-

      - name: repo init + local manifest
        working-directory: /home/runner/work/los
        run: |
          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git config --global color.ui false
          # partial clone: the official LOS recipe for disk-constrained hosts;
          # without it a shallow LOS 22.2 sync alone ENOSPCs the 145G runner.
          # No --git-lfs: nothing in a star2lte device build needs LFS and
          # lfs pulls bypass the partial-clone blob filter.
          repo init --depth=1 --partial-clone --clone-filter=blob:limit=500K \
            -u https://github.com/LineageOS/android.git -b lineage-22.2
          mkdir -p .repo/local_manifests
          # actions/checkout with path: repo-config lands at
          # $GITHUB_WORKSPACE/repo-config (NOT the parent dir) — this path was
          # the exact cause of run #1 failing in Skyshadow2022/star2lte-los22.
          cp "$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml" .repo/local_manifests/star2lte.xml
          test -f .repo/local_manifests/star2lte.xml

      - name: repo sync (shallow, monitored)
        working-directory: /home/runner/work/los
        run: |
          # disk growth monitor: runs #1/#3 died mid-sync with no clue where
          # the bytes went; this logs the real curve and survives the failure
          (
            while true; do
              echo "$(date +%H:%M:%S) los=$(df -B1 --output=used /home/runner/work/los | tail -1 | tr -d ' ') root_used=$(df -B1 --output=used / | tail -1 | tr -d ' ') root_avail=$(df -B1 --output=avail / | tail -1 | tr -d ' ')"
              sleep 20
            done
          ) &
          MONPID=$!
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch \
            --prune -j"$(nproc)" || \
          repo sync -c --no-clone-bundle --no-tags -j4
          kill $MONPID 2>/dev/null || true
          df -h /home/runner/work/los /

      - name: Disk report (always)
        if: always()
        run: df -h / /home/runner/work/los 2>/dev/null; du -sh /home/runner/work/los/.repo/project-objects 2>/dev/null || true; du -sh /home/runner/work/los/* 2>/dev/null | sort -h | tail -15 || true

      - name: Build ROM
        if: ${{ inputs.mode == 'build' }}
        working-directory: /home/runner/work/los
        env:
          CCACHE_DIR: /home/runner/work/los/.ccache
          CCACHE_EXEC: /usr/bin/ccache
        run: |
          ccache -M 12G
          export USE_CCACHE=1
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          breakfast star2lte ${{ inputs.variant }}
          mka bacon -j"$(nproc)"

      - name: Collect artifacts
        if: ${{ inputs.mode == 'build' }}
        working-directory: /home/runner/work/los
        run: |
          mkdir -p out-artifacts
          cp out/target/product/star2lte/lineage-*.zip out-artifacts/ 2>/dev/null || true
          cp out/target/product/star2lte/recovery.img out-artifacts/ 2>/dev/null || true
          cp out/target/product/star2lte/boot.img out-artifacts/ 2>/dev/null || true
          ls -la out-artifacts

      - name: Upload ROM
        if: ${{ inputs.mode == 'build' }}
        uses: actions/upload-artifact@v4
        with:
          name: lineage-22.2-star2lte
          path: /home/runner/work/los/out-artifacts/*
          if-no-files-found: warn
          retention-days: 7
